<style>
:root {
	--bg: #3f3cde;
	--panel: #57aaeb;
	--panel2: #9bccf2;

	--accent: #b3dde8;

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background: var(--bg);
	color: var(--text);
	font-family: Inter, sans-serif;
}

.wrap {
	max-width: 1900px;

}

.layout {

}

.sidebar {

}

.badge {

	font-size: 11px;
	font-family: "JetBrains Mono", monospace;
}

.copy {

	border: 1px solid var(--border);
	color: black;

	padding: 8px 12px;

	font-size: 11px;
}

.body {

}

.row {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 18px;
}

.block {
	background: #c3e5eb;
	border: 1px solid var(--border);
	border-radius: 14px;
	padding: 14px;
}

.small {
	color: var(--muted);
	font-size: 11px;
	margin-bottom: 8px;

}

.code {

	font-size: 11px;

.toast {
	position: fixed;

	bottom: 20px;
	background: var(--green);
	color: white;
	padding: 14px 18px;
	border-radius: 12px;
	font-weight: 800;
	opacity: 0;
	transform: translateY(30px);
	transition: .3s;
}

.toast.show {
	opacity: 1;
	transform: translateY(0);
}

@media(max-width:1200px) {
	.layout {
		grid-template-columns: 1fr;
	}

	.sidebar {
		position: relative;
		height: auto;
	}

	.grid {
		grid-template-columns: 1fr;
	}

	.row {
		grid-template-columns: 1fr;
	}
}
body {

<body>
<div class="wrap">
  <div class="header">
    <div class="title" align="center" style="font-family: Impact, fantasy; color:#95b4ed;">SUBJECT/FROM ENCODER</div>
    <div class="desc" align="center">Note : Some encoding methods are not working for yahoo mailing. So check and Use it properly.</div>
  </div>
  <div class="layout">

      <div class="label">ENTER ALL YOUR SUBJECTS: </div>
      <textarea id="subjects">
Live Amazon Incredible Spring Deals</textarea>

</textarea>
      <button class="btn" onclick="generateAll()">Generate 12,000+ Encodings</button>
      <div class="stats">
        <div class="stat"><div class="num" id="count">0</div><div class="txt">UNIQUE PAIRS</div></div>
        <div class="stat"><div class="num">12,000+</div><div class="txt">ENCODING METHODS</div></div>
      </div>

    <div class="main">

      </div>
      <div id="grid" class="grid"></div>

  </div>
</div>
<div class="toast" id="toast">Copied</div>

<script>
const charsets = ['UTF-8','ISO-8859-1','WINDOWS-1252','UTF-16','UTF-16BE','UTF-16LE','US-ASCII','SHIFT_JIS','GBK','BIG5','unicode-1-1-utf-8','unicode11utf8','unicode20utf8','utf-8','utf8','x-unicode20utf8','866','cp866','csibm866','ibm866','csisolatin2','iso-8859-2','iso-ir-101','iso8859-2','iso88592','iso_8859-2','iso_8859-2:1987','l2','latin2','csisolatin3','iso-8859-3','iso-ir-109','iso8859-3','iso88593','iso_8859-3','iso_8859-3:1988','l3','latin3','csisolatin4','iso-8859-4','iso-ir-110','iso8859-4','iso88594','iso_8859-4','iso_8859-4:1988','l4','latin4','csisolatincyrillic','cyrillic','iso-8859-5','iso-ir-144','iso8859-5','iso88595','iso_8859-5','iso_8859-5:1988','arabic','asmo-708','csiso88596e','csiso88596i','csisolatinarabic','ecma-114','iso-8859-6','iso-8859-6-e','iso-8859-6-i','iso-ir-127','iso8859-6','iso88596','iso_8859-6','iso_8859-6:1987','csisolatingreek','ecma-118','elot_928','greek','greek8','iso-8859-7','iso-ir-126','iso8859-7','iso88597','iso_8859-7','iso_8859-7:1987','sun_eu_greek','csiso88598e','csisolatinhebrew','hebrew','iso-8859-8','iso-8859-8-e','iso-ir-138','iso8859-8','iso88598','iso_8859-8','iso_8859-8:1988','visual','csiso88598i','iso-8859-8-i','logical','csisolatin6','iso-8859-10','iso-ir-157','iso8859-10','iso885910','l6','latin6','iso-8859-13','iso8859-13','iso885913','iso-8859-14','iso8859-14','iso885914','csisolatin9','iso-8859-15','iso8859-15','iso885915','iso_8859-15','l9','iso-8859-16','cskoi8r','koi','koi8','koi8-r','koi8_r','koi8-ru','koi8-u','csmacintosh','mac','macintosh','x-mac-roman','dos-874','iso-8859-11','iso8859-11','iso885911','tis-620','windows-874','cp1250','windows-1250','x-cp1250','cp1251','windows-1251','x-cp1251','ansi_x3.4-1968','ascii','cp1252','cp819','csisolatin1','ibm819','iso-8859-1','iso-ir-100','iso8859-1','iso88591','iso_8859-1','iso_8859-1:1987','l1','latin1','us-ascii','windows-1252','x-cp1252','cp1253','windows-1253','x-cp1253','cp1254','csisolatin5','iso-8859-9','iso-ir-148','iso8859-9','iso88599','iso_8859-9','iso_8859-9:1989','l5','latin5','windows-1254','x-cp1254','cp1255','windows-1255','x-cp1255','cp1256','windows-1256','x-cp1256','cp1257','windows-1257','x-cp1257','cp1258','windows-1258','x-cp1258','x-mac-cyrillic','x-mac-ukrainian','chinese','csgb2312','csiso58gb231280','gb2312','gb_2312','gb_2312-80','gbk','iso-ir-58','x-gbk','gb18030','big5','big5-hkscs','cn-big5','csbig5','x-x-big5','cseucpkdfmtjapanese','euc-jp','x-euc-jp','csiso2022jp','iso-2022-jp','csshiftjis','ms932','ms_kanji','shift-jis','shift_jis','sjis','windows-31j','x-sjis','cseuckr','csksc56011987','euc-kr','iso-ir-149','korean','ks_c_5601-1987','ks_c_5601-1989','ksc5601','ksc_5601','windows-949','csiso2022kr','hz-gb-2312','iso-2022-cn','iso-2022-cn-ext','iso-2022-kr','replacement','unicodefffe','utf-16be','csunicode','iso-10646-ucs-2','ucs-2','unicode','unicodefeff','utf-16','utf-16le','x-user-defined'];
const methods = ['B','Q','HEXQ'];
const spacings = [' ','  ','   '];
const folds = [30,40,50,60,70];
const wordModes = ['normal','split','pair','triple'];

let allResults = [];

// Dynamic Multi-Charset Byte Encoder
function getCharsetBytes(str, charset) {
  const upperCS = charset.toUpperCase();
  
  // Natively handle UTF-8 and US-ASCII
  if (upperCS === 'UTF-8' || upperCS === 'US-ASCII') {
    return Array.from(new TextEncoder().encode(str));
  }
  
  // Handle UTF-16 Variations
  if (upperCS.startsWith('UTF-16')) {
    let bytes = [];
    for (let i = 0; i < str.length; i++) {
      let code = str.charCodeAt(i);
      let b1 = (code >> 8) & 0xFF;
      let b2 = code & 0xFF;
      if (upperCS === 'UTF-16LE') {
        bytes.push(b2, b1);
      } else {
        bytes.push(b1, b2); // Default Big-Endian
      }
    }
    return bytes;
  }
  
  // Custom Fallback Encoder for Legacy 8-bit and DBCS Charsets
  let bytes = [];
  for (let i = 0; i < str.length; i++) {
    let code = str.charCodeAt(i);
    if (code <= 0x7F) {
      bytes.push(code);
    } else if (upperCS === 'ISO-8859-1' || upperCS === 'WINDOWS-1252') {
      bytes.push(code & 0xFF);
    } else {
      // Basic split fallback for high-byte double characters (GBK, Big5, Shift_JIS)
      bytes.push((code >> 8) & 0xFF, code & 0xFF);
    }
  }
  return bytes.filter(b => b !== 0 || upperCS.startsWith('UTF-16'));
}

function hexQP(str, charset){
  let out = '';
  getCharsetBytes(str, charset).forEach(b=>{
    out += '=' + b.toString(16).toUpperCase().padStart(2,'0');
  });
  return out;
}

function b64(str, charset){
  let bin = '';
  getCharsetBytes(str, charset).forEach(b=>{
    bin += String.fromCharCode(b);
  });
  return btoa(bin);
}

function qp(str, charset){
  let out = '';
  getCharsetBytes(str, charset).forEach(b=>{
    if (b === 32) {
      out += '_'; // Required by RFC 2047: structural space inside Q must be an underscore
    } else if(b >= 33 && b <= 126 && b !== 61 && b !== 95){
      out += String.fromCharCode(b);
    } else {
      out += '=' + b.toString(16).toUpperCase().padStart(2,'0');
    }
  });
  return out;
}

function foldMIME(chunks, maxLineSize) {
  let lines = [];
  let currentLine = "";

  for (let i = 0; i < chunks.length; i++) {
    let token = chunks[i];
    if (currentLine === "") {
      currentLine = token;
    } else {
      if ((currentLine + " " + token).length > maxLineSize) {
        lines.push(currentLine);
        currentLine = token;
      } else {
        currentLine += " " + token;
      }
    }
  }
  if (currentLine !== "") {
    lines.push(currentLine);
  }
  return lines.join('\r\n');
}

function buildAdvanced(text, charset, method, spacing, foldSize, wordMode){
  const rawWords = text.split(' ');
  if (rawWords.length === 0 || text === '') return '';

  let groupings = [];

  if(wordMode === 'normal'){
    groupings = [rawWords.join(' ')];
  } else if(wordMode === 'split'){
    groupings = rawWords;
  } else if(wordMode === 'pair'){
    for (let i = 0; i < rawWords.length; i += 2) {
      groupings.push(rawWords.slice(i, i + 2).join(' '));
    }
  } else if(wordMode === 'triple'){
    for (let i = 0; i < rawWords.length; i += 3) {
      groupings.push(rawWords.slice(i, i + 3).join(' '));
    }
  }

  const encodedChunks = groupings.map((chunk, idx) => {
    let chunkPayload = chunk;
    
    // Inject custom spacing layout into the string before running encoding processes
    if (idx < groupings.length - 1) {
      chunkPayload += spacing;
    }

    if(chunkPayload === '') return '';

    if(method === 'B'){
      return `=?${charset}?B?${b64(chunkPayload, charset)}?=`;
    }
    if(method === 'Q'){
      return `=?${charset}?Q?${qp(chunkPayload, charset)}?=`;
    }
    if(method === 'HEXQ'){
      return `=?${charset}?Q?${hexQP(chunkPayload, charset)}?=`;
    }
    return '';
  }).filter(Boolean);

  return foldMIME(encodedChunks, foldSize);
}

function generateAll(){
  allResults = [];
  const unique = new Set();
  const subjects = document.getElementById('subjects').value.split('\n').map(v=>v.trim()).filter(Boolean);
  const froms = document.getElementById('froms').value.split('\n').map(v=>v.trim()).filter(Boolean);
  
  subjects.forEach(subject=>{
    froms.forEach(from=>{
      charsets.forEach(charset=>{
        methods.forEach(method=>{
          spacings.forEach(spaceMode=>{
            folds.forEach(foldSize=>{
              wordModes.forEach(wordMode=>{
                const subEncoded = buildAdvanced(subject, charset, method, spaceMode, foldSize, wordMode);
                const fromEncoded = buildAdvanced(from, charset, method, spaceMode, foldSize, wordMode);
                const key = subEncoded + fromEncoded;
                if(!unique.has(key)){
                  unique.add(key);
                  allResults.push({
                    subject,
                    from,
                    charset,
                    method,
                    subEncoded,
                    fromEncoded
                  });
                }
              });
            });
          });
        });
      });
    });
  });
  document.getElementById('count').innerText = allResults.length;
  render();
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = allResults.filter(r=>
    r.subject.toLowerCase().includes(q)  ||
    r.from.toLowerCase().includes(q)     ||
    r.subEncoded.toLowerCase().includes(q) ||
    r.fromEncoded.toLowerCase().includes(q)
  );
  
  document.getElementById('grid').innerHTML = filtered.map((r,i)=>`
    <div class="card">
      <div class="head">
        <div class="badge">${r.charset} / ${r.method}</div>
        <button class="copy" onclick="copyPair(\`${escapeBackticks(r.subEncoded)}\`,\`${escapeBackticks(r.fromEncoded)}\`)">Copy Pair</button>
      </div>
      <div class="body">
        <div class="row">
          <div class="block">
            <div class="small">SUBJECT</div>
            <div class="code">${escapeHtml(r.subEncoded)}</div>
          </div>
          <div class="block">
            <div class="small">FROM</div>
            <div class="code">${escapeHtml(r.fromEncoded)}</div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function copyPair(subject,from){
  navigator.clipboard.writeText(`Subject: ${subject}\nFrom: ${from}`);
  showToast();
}

function copyAll(){
  navigator.clipboard.writeText(
    allResults.map(r=>`Subject: ${r.subEncoded}\nFrom: ${r.fromEncoded}`).join('\n\n')
  );
  showToast();
}

function showToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>{ t.classList.remove('show'); },1800);
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escapeBackticks(str){
  return str.replace(/`/g,'\\`');
}

generateAll();
</script>
