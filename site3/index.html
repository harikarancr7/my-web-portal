<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Pro | Fast Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100-vh; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-4xl mx-auto glass p-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">
                <i class="fas fa-globe-americas text-indigo-600 mr-2"></i>Domain Extractor
            </h1>
            <p class="text-gray-600">Paste your email list below to extract clean domains instantly.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Input List (Email/Fnames)</label>
                <textarea id="inputData" class="w-full h-80 p-4 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none transition" placeholder="user@example.com&#10;admin@test.org&#10;info@company.co.uk"></textarea>
                <div class="mt-4 flex gap-2">
                    <button onclick="extractDomains()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition transform active:scale-95">
                        Extract Domains <i class="fas fa-magic ml-2"></i>
                    </button>
                    <button onclick="clearAll()" class="px-4 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg transition">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-bold text-gray-700">Clean Domains</label>
                    <span id="count" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-bold">0 found</span>
                </div>
                <textarea id="outputData" readonly class="w-full h-80 p-4 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl text-indigo-900 font-medium" placeholder="Results will appear here..."></textarea>
                <button onclick="copyToClipboard()" class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition transform active:scale-95">
                    Copy Results <i class="fas fa-copy ml-2"></i>
                </button>
            </div>
        </div>

        <div class="mt-10 pt-6 border-t border-gray-100 text-center text-gray-400 text-xs">
            Professional Bulk Email Domain Processor • 2026 Edition
        </div>
    </div>

    <script>
        function extractDomains() {
            const input = document.getElementById('inputData').value;
            const outputArea = document.getElementById('outputData');
            const countLabel = document.getElementById('count');

            if (!input.trim()) {
                alert("Please paste some data first!");
                return;
            }

            // Logic: Split lines, find @, take the part after it, filter unique
            const lines = input.split('\n');
            const domains = lines
                .map(line => line.includes('@') ? line.split('@').pop().trim() : line.trim())
                .filter(line => line.length > 0);

            // Remove duplicates
            const uniqueDomains = [...new Set(domains)];

            outputArea.value = uniqueDomains.join('\n');
            countLabel.innerText = `${uniqueDomains.length} unique domains`;
        }

        function copyToClipboard() {
            const output = document.getElementById('outputData');
            if (!output.value) return;
            
            output.select();
            document.execCommand('copy');
            
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Copied! <i class="fas fa-check ml-2"></i>';
            btn.classList.replace('bg-emerald-500', 'bg-gray-800');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.replace('bg-gray-800', 'bg-emerald-500');
            }, 2000);
        }

        function clearAll() {
            document.getElementById('inputData').value = '';
            document.getElementById('outputData').value = '';
            document.getElementById('count').innerText = '0 found';
        }
    </script>
</body>
</html>
